<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Space Trader is a trading game across 128 star systems. Buy low, sell high, and retire to a moon. Install it and play offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Space Trader" />
    <title>Space Trader</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <p class="eyebrow">Space Trader</p>
            <p>Plotting the sector…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        The chart failed to load.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="js/save.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <noscript>Space Trader needs WebAssembly to run.</noscript>
</body>

</html>
